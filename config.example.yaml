# Copy to config.yaml. URLs are contacted by this Python app, not by the browser.
llm:
  base_url: http://192.168.1.50:8001/v1
  model: Qwen/Qwen3.8-27B # Must match /v1/models on your vLLM server.
  # api_key_env: VLLM_API_KEY
  timeout_seconds: 180
  max_tokens: 4096
  temperature: 0.4
  max_tool_rounds: 8

tts:
  base_url: http://192.168.1.51:8000
  anonymous_session: true # Start TTS with --anonymous-sessions.
  # For static tokens: set anonymous_session: false and api_key_env: TTS_API_KEY
  timeout_seconds: 180
  job_timeout_seconds: 900
  poll_seconds: 1

host: 127.0.0.1
port: 7860
allowed_hosts: [127.0.0.1, localhost, '::1']
storage_dir: .demo-data # Relative to this YAML file.
max_turns: 40
max_audio_seconds: 1800
